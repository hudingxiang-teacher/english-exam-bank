# Render 一键部署配置
# 文档：https://render.com/docs/blueprint-spec
services:
  - type: web
    name: exam-bank
    runtime: python
    plan: starter  # starter 支持持久化磁盘；如用 free plan 数据重启后丢失
    buildCommand: pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
    startCommand: gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:$PORT --timeout 120 app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true  # 自动生成随机密钥
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: RENDER_DATA_DIR
        value: /opt/render/project/data
    disk:
      name: exam-data
      mountPath: /opt/render/project/data
      sizeGB: 1
    healthCheckPath: /
    autoDeploy: true  # 推送 GitHub 自动部署

# 如需 PostgreSQL 数据库，取消下方注释并在 Web Service 环境变量中添加 DATABASE_URL
